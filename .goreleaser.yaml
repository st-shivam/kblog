version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: kblog
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "kblog_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - plugin/plugins.yaml
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  header: "{{ .Env.RELEASE_NOTES }}"
