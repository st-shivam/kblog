title: kblog
description: Kubernetes log-tailing TUI with real-time event injection, JSON inspection, and themes.
url: "https://st-tripathi.github.io"
baseurl: "/kblog"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: dark

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Aux links in the top-right corner
aux_links:
  "GitHub":
    - "https://github.com/st-tripathi/kblog"

aux_links_new_tab: true

# Footer
footer_content: "Released under the <a href=\"https://github.com/st-tripathi/kblog/blob/main/LICENSE\">MIT License</a>."

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Heading anchor links
heading_anchors: true

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

permalink: pretty
